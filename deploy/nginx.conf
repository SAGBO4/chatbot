# Production Nginx reverse proxy configuration for Support Bot Backend
# Protects sensitive query tokens (e.g. Brevo ?token=...) from leaking into access logs.

log_format redacted_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent"';

server {
    listen 80;
    server_name support.example.com;

    # Redirect HTTP to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name support.example.com;

    # Configure SSL certificates
    ssl_certificate /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    # Brevo inbound email webhook endpoint: redact query string from access logs
    # to prevent token exposure in disk logs and log shipping pipelines.
    location /api/webhooks/email-inbound/brevo {
        access_log /var/log/nginx/access.log redacted_combined;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other endpoints use standard logging
    location / {
        access_log /var/log/nginx/access.log combined;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
